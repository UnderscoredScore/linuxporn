<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>linuxporn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            background-color: #0a0a0a;
            font-family: 'VT323', 'Courier New', monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #33ff33;
            text-align: center;
            padding: 1.5rem;
            line-height: 1.4;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 3px
            );
            pointer-events: none;
            z-index: 10;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(
                ellipse at center,
                transparent 40%,
                rgba(0, 0, 0, 0.55) 100%
            );
            pointer-events: none;
            z-index: 9;
        }

        .container {
            max-width: 700px;
            width: 100%;
            background: #0d0d0d;
            border: 2px solid #1e3a1e;
            border-radius: 10px;
            padding: 4rem 2rem 3.5rem;
            box-shadow:
                0 0 0 1px #0a1a0a,
                0 0 40px rgba(51, 255, 51, 0.08),
                inset 0 0 60px rgba(0, 0, 0, 0.7);
            position: relative;
            z-index: 1;
        }

        .container::before {
            content: "";
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            bottom: 8px;
            border: 1px solid #143314;
            border-radius: 6px;
            pointer-events: none;
        }

        .logo {
            font-family: 'VT323', monospace;
            font-size: 3.4rem;
            font-weight: 400;
            letter-spacing: 4px;
            color: #33ff33;
            text-shadow:
                0 0 8px rgba(51, 255, 51, 0.55),
                0 0 24px rgba(51, 255, 51, 0.25);
            margin-bottom: 2.5rem;
            line-height: 1;
        }

        .logo .dim {
            color: #1a8c1a;
            text-shadow: none;
        }

        .message {
            font-family: 'VT323', monospace;
            font-size: 2.2rem;
            letter-spacing: 1.5px;
            color: #d8ffd8;
            margin-bottom: 0.4rem;
        }

        .message .accent {
            color: #33ff33;
            text-shadow: 0 0 10px rgba(51, 255, 51, 0.4);
        }

        .divider {
            width: 60%;
            max-width: 320px;
            height: 1px;
            margin: 2rem auto 1.8rem;
            background: linear-gradient(
                90deg,
                transparent,
                #1e3a1e 20%,
                #33ff33 50%,
                #1e3a1e 80%,
                transparent
            );
            opacity: 0.6;
        }

        .status {
            font-family: 'VT323', monospace;
            font-size: 1.4rem;
            letter-spacing: 2px;
            color: #6fbf6f;
        }

        .cursor {
            display: inline-block;
            width: 0.55em;
            height: 1em;
            background-color: #33ff33;
            margin-left: 6px;
            vertical-align: text-bottom;
            box-shadow: 0 0 8px rgba(51, 255, 51, 0.6);
            animation: blink 1.1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .tape {
            margin-top: 2.6rem;
            font-family: 'VT323', monospace;
            font-size: 0.95rem;
            letter-spacing: 6px;
            color: #b58a1e;
            border-top: 1px dashed #2a2a1a;
            border-bottom: 1px dashed #2a2a1a;
            padding: 0.6rem 0;
            text-transform: uppercase;
            opacity: 0.75;
        }

        @media (max-width: 550px) {
            .container {
                padding: 2.8rem 1.2rem 2.2rem;
            }

            .logo {
                font-size: 2.4rem;
                letter-spacing: 2px;
                margin-bottom: 1.8rem;
            }

            .message {
                font-size: 1.6rem;
            }

            .status {
                font-size: 1.1rem;
            }

            .tape {
                font-size: 0.75rem;
                letter-spacing: 3px;
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="logo">LINUX<span class="dim">PORN</span></div>

        <div class="message">
            <span class="accent">linuxporn</span> is under construction
        </div>

        <div class="divider"></div>

        <div class="status">
            coming soon<span class="cursor"></span>
        </div>

        <div class="tape">stay tuned</div>

    </div>
</body>
</html>
